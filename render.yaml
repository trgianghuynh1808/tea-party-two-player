# Render Blueprint: one free web service running the Colyseus server,
# which also serves the built client (same origin for HTTP + WebSocket).
# Free instances sleep after 15 min without traffic; the first visit after that takes ~1 min to wake up.
services:
  - type: web
    name: boba-shop
    branch: main
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit       # commit | checksPass | off
    buildFilter:
         ignoredPaths:
            - .agents/**
            - scripts/**
            - tests/**
            - "**/*.md"
            - playwright.config.ts
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Persistent saves (money + furniture). The free disk is wiped on restart, so saves go to
      # Upstash Redis (free tier). Set both values in the Render dashboard; sync: false keeps them out of git.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Admin API (GET/PUT /admin/users/:name...) for backups and restores. Set a long random value; unset = disabled.
      - key: ADMIN_TOKEN
        sync: false
