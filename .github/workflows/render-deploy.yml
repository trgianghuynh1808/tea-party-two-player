# Trigger a Render deploy on every push to main (Render's own GitHub auto-deploy is not wired up).
# Needs the repo secret RENDER_DEPLOY_HOOK_URL (Render service > Settings > Deploy Hook).
name: Deploy to Render

on:
  push:
    branches: [main]
    paths-ignore:
      - ".agents/**"
      - "scripts/**"
      - "tests/**"
      - "**/*.md"
      - "playwright.config.ts"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Call Render deploy hook
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$HOOK_URL" || { echo "RENDER_DEPLOY_HOOK_URL secret is missing"; exit 1; }
          curl --fail --silent --show-error -X POST "$HOOK_URL"
